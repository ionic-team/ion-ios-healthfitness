included:
  - Sources
  - Tests

disabled_rules:
  - trailing_whitespace
  - function_parameter_count
  - trailing_newline
  - colon
  - comma
  - opening_brace
  - large_tuple
  - function_name_whitespace

opt_in_rules:
  - empty_count
  - empty_string

line_length:
  warning: 200
  error: 250
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true
function_body_length:
  warning: 300
  error: 500
type_body_length:
  warning: 550
  error: 700
file_length:
  warning: 1200
  error: 1500
  ignore_comment_only_lines: true
cyclomatic_complexity:
  warning: 25
  error: 30
reporter: "xcode"
